{{define "layout.html"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} — KryoState</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/htmx.min.js" defer></script>
<script src="/static/sse.js" defer></script>
<script src="/static/app.js" defer></script>
<script src="/static/charts.js" defer></script>
</head>
<body hx-indicator="#spinner">
<a class="skip-link" href="#main">Skip to content</a>
<nav class="nav">
  <a class="nav__brand" href="/">KryoState</a>
  <a href="/" {{if eq .Nav "home"}}aria-current="page"{{end}} hx-get="/" hx-target="#main" hx-push-url="true">Overview</a>
  <a href="/hosts" {{if eq .Nav "hosts"}}aria-current="page"{{end}} hx-get="/hosts" hx-target="#main" hx-push-url="true">Inventory</a>
  <a href="/stacks" {{if eq .Nav "stacks"}}aria-current="page"{{end}} hx-get="/stacks" hx-target="#main" hx-push-url="true">Stacks</a>
  <a href="/charts" {{if eq .Nav "charts"}}aria-current="page"{{end}} hx-get="/charts" hx-target="#main" hx-push-url="true">Charts</a>
  <a href="/changes" {{if eq .Nav "changes"}}aria-current="page"{{end}} hx-get="/changes" hx-target="#main" hx-push-url="true">Changes</a>
  <a href="/rules" {{if eq .Nav "rules"}}aria-current="page"{{end}} hx-get="/rules" hx-target="#main" hx-push-url="true">Rules</a>
  <a href="/runs" {{if eq .Nav "runs"}}aria-current="page"{{end}} hx-get="/runs" hx-target="#main" hx-push-url="true">Runs</a>
  <a href="/schedules" {{if eq .Nav "schedules"}}aria-current="page"{{end}} hx-get="/schedules" hx-target="#main" hx-push-url="true">Schedules</a>
  <a href="/collectors" {{if eq .Nav "collectors"}}aria-current="page"{{end}} hx-get="/collectors" hx-target="#main" hx-push-url="true">Collectors</a>
  <span class="nav__spacer"></span>
  <a href="/guide" {{if eq .Nav "guide"}}aria-current="page"{{end}} hx-get="/guide" hx-target="#main" hx-push-url="true">Guide</a>
  <span class="htmx-indicator muted" id="spinner">working…</span>
</nav>
<main class="content" id="main">
{{with .Flash}}<div class="flash flash--{{.Kind}}" role="{{if eq .Kind "error"}}alert{{else}}status{{end}}">{{.Text}}</div>{{end}}
{{.Content}}
</main>
</body>
</html>{{end}}
