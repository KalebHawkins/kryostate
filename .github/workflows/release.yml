name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"   # the newest patch release; 1.27.0 and 1.27.1 lack html/template fixes

      - run: go vet ./...

      - run: go test ./...

  release:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write   # the GitHub release and its files
      packages: write   # the image on ghcr.io
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the changelog is made from the commits

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"   # the newest patch release; 1.27.0 and 1.27.1 lack html/template fixes

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: anchore/sbom-action/download-syft@v0

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
