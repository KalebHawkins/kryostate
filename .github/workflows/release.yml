name: release

# Every push to main that passes ci is released: the patch number of the
# newest v* tag is bumped (v0.1.0 when there is none), the commit is tagged,
# and GoReleaser publishes it. For a minor or major bump, push the tag
# yourself (git tag v1.0.0 && git push origin v1.0.0); later releases count
# up from it.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]

permissions:
  contents: read

# One release at a time, so two quick pushes to main get two versions.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    # ci has already tested a commit that reached here through workflow_run.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"   # the newest patch release; go.mod requires 1.27.4 or later for security fixes

      - run: go vet ./...

      - run: go test ./...

  release:
    runs-on: ubuntu-latest
    needs: test
    if: >-
      always() &&
      (
        (github.event_name == 'push' && needs.test.result == 'success') ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push')
      )
    permissions:
      contents: write   # the tag, the GitHub release and its files
      packages: write   # the image on ghcr.io
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0   # the changelog is made from the commits

      # A tag pushed with GITHUB_TOKEN does not start another workflow run,
      # so the commit is tagged and released in this one.
      - name: Tag the release
        id: tag
        if: github.event_name == 'workflow_run'
        run: |
          if existing=$(git tag --points-at HEAD --list 'v*' | head -n1) && [ -n "$existing" ]; then
            echo "HEAD is already tagged $existing; it is or will be released by that tag."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
          if [ -z "$latest" ]; then
            next=v0.1.0
          else
            IFS=. read -r major minor patch <<< "${latest#v}"
            next="v${major}.${minor}.$((patch + 1))"
          fi
          echo "Releasing $next (previous: ${latest:-none})"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$next" -m "$next"
          git push origin "refs/tags/$next"

      - uses: actions/setup-go@v5
        if: steps.tag.outputs.skip != 'true'
        with:
          go-version: "1.27.x"   # the newest patch release; go.mod requires 1.27.4 or later for security fixes

      - uses: docker/setup-qemu-action@v3
        if: steps.tag.outputs.skip != 'true'

      - uses: docker/setup-buildx-action@v3
        if: steps.tag.outputs.skip != 'true'

      - uses: docker/login-action@v3
        if: steps.tag.outputs.skip != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: anchore/sbom-action/download-syft@v0
        if: steps.tag.outputs.skip != 'true'

      - uses: goreleaser/goreleaser-action@v6
        if: steps.tag.outputs.skip != 'true'
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
